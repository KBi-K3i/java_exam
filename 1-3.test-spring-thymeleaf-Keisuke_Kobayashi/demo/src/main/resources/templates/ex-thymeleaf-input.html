<!-- ex-thymeleaf-input.html -->
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div th:each="item : ${member}">
        <p>名前：<span th:text="${item.name}">name</span></p>
        <p>年齢：<span th:text="${item.age}">age</span></p>

        <p>趣味</p>
        <div th:each="hobby : ${item.hobbyList}">
            <span th:text="${hobby}">item</span>
        </div>
    </div>
</body>
</html>
